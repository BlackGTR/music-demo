spring.application.name=Lab2

spring.datasource.url=jdbc:postgresql://localhost:5432/musicdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (для прода — использовать переменную окружения)
jwt.secret=${JWT_SECRET:default-secret-key-for-development-only-min-256-bits}
